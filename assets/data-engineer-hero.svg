<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 440" role="img" aria-labelledby="title description">
  <title id="title">Branesh P — Data Engineer</title>
  <desc id="description">A dark navy banner with a subtle data-flow motif in blue, cyan, and purple.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081326"/>
      <stop offset="1" stop-color="#11172e"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset=".55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#64748b" stroke-opacity=".11" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".24"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="440" rx="18" fill="url(#background)"/>
  <rect width="1600" height="440" rx="18" fill="url(#grid)"/>
  <ellipse cx="1360" cy="210" rx="400" ry="310" fill="url(#glow)"/>
  <g fill="none" stroke="url(#flow)" stroke-opacity=".42" stroke-width="2">
    <path d="M930 95h150l70 70h150"/>
    <path d="M1010 220h120l75-75h190"/>
    <path d="M930 345h155l75-75h200"/>
    <path d="M1225 165v105"/>
    <path d="M1360 145v125"/>
  </g>
  <g fill="#0b172b" stroke="url(#flow)" stroke-width="2">
    <rect x="920" y="82" width="20" height="26" rx="5"/>
    <rect x="1290" y="151" width="20" height="26" rx="5"/>
    <rect x="990" y="207" width="20" height="26" rx="5"/>
    <rect x="1460" y="132" width="20" height="26" rx="5"/>
    <rect x="920" y="332" width="20" height="26" rx="5"/>
    <rect x="1365" y="257" width="20" height="26" rx="5"/>
    <circle cx="1150" cy="165" r="6"/>
    <circle cx="1205" cy="145" r="6"/>
    <circle cx="1085" cy="345" r="6"/>
  </g>
  <text x="128" y="190" fill="#eef5ff" font-family="Segoe UI, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="2">BRANESH P</text>
  <text x="134" y="252" fill="#67e8f9" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" letter-spacing="8">DATA ENGINEER</text>
  <path d="M134 292h420" stroke="url(#flow)" stroke-width="3"/>
  <text x="134" y="337" fill="#a5b4cc" font-family="Segoe UI, Arial, sans-serif" font-size="18" letter-spacing="3">DATA SYSTEMS  /  DISTRIBUTED COMPUTING  /  CLOUD</text>
</svg>
